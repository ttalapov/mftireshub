<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#c9181e" />
  <meta name="robots" content="noindex" />
  <title>Сторінку не знайдено — MF Tires Hub</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #fff;
      font-family: 'Nunito', sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 9999px;
      box-shadow: 0 0 0 2px rgba(201,24,30,.4);
      margin: 0 auto 1.5rem;
      display: block;
    }
    .code {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 700;
      line-height: 1;
      color: #c9181e;
    }
    h1 {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(1.25rem, 5vw, 1.75rem);
      font-weight: 600;
      margin: .75rem 0 .5rem;
    }
    p { color: #c8c8c8; margin-bottom: 2rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      padding: .875rem 2rem;
      border-radius: 9999px;
      text-decoration: none;
      white-space: nowrap;
      transition: background .2s, border-color .2s;
    }
    .btn-red { background: #c9181e; color: #fff; }
    .btn-red:hover { background: #e8282f; }
    .btn-ghost { border: 2px solid rgba(255,255,255,.25); color: #fff; }
    .btn-ghost:hover { border-color: rgba(255,255,255,.6); }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <img src="/img/logo.webp" alt="MF Tires Hub" class="logo" width="72" height="72" />
    <div class="code" aria-hidden="true">404</div>
    <h1>Сторінку не знайдено</h1>
    <p>Такої сторінки не існує або її перенесено.<br />Але шини на місці — телефонуйте!</p>
    <div class="actions">
      <a href="/" class="btn btn-red">На головну</a>
      <a href="tel:+380631715111" class="btn btn-ghost">+38 (063) 171-51-11</a>
    </div>
  </main>
</body>
</html>
